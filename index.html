<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Radar Comercial - Norte y Centroamérica</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1150px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-container {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .logo {
            max-height: 70px;
            object-fit: contain;
        }
        h1 {
            color: #1a252f;
            margin: 0;
            font-size: 28px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        select, input[type="text"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        select {
            width: 260px;
            background-color: #f8f9fa;
        }
        input[type="text"] {
            flex: 1;
        }
        button {
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .botones-accion {
            display: none; 
            gap: 10px;
        }
        .btn-copiar-todos {
            background-color: #27ae60;
            font-size: 14px;
            padding: 10px 15px;
        }
        .btn-copiar-todos:hover {
            background-color: #219653;
        }
        .btn-copiar-tabla {
            background-color: #8e44ad;
            font-size: 14px;
            padding: 10px 15px;
        }
        .btn-copiar-tabla:hover {
            background-color: #732d91;
        }
        .resultados-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            min-height: 45px;
        }
        .status {
            font-size: 15px;
            color: #2c3e50;
            font-weight: bold;
        }
        .status.error {
            color: #c0392b;
        }
        .loader {
            display: none;
            color: #e67e22;
            font-weight: bold;
        }
        .table-container {
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }
        th {
            background-color: #2c3e50;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .badge {
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .badge.imp { background-color: #8e44ad; }
        .badge.exp { background-color: #27ae60; }
        .badge.both { background-color: #f39c12; }
        .badge.fab { background-color: #2980b9; }
        .data-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .data-cell:last-child {
            margin-bottom: 0;
        }
        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #95a5a6;
            padding: 2px 5px;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            color: #3498db;
            transform: scale(1.1);
        }
    </style>
</head>

<div class="container">
    <div class="header-container">
        <img src="https://github.com/auxiliar-tgg/photos-tgg/blob/main/LOGO.png?raw=true" alt="Logo de la Empresa" class="logo">
        <h1>Radar Comercial - Directorio Real Norte y Centroamérica</h1>
    </div>
    
    <div class="search-box">

            <option value="MX_CENTRO">México / Centroamérica (Español)</option>
        </select>
        <input type="text" id="estadoInput" list="ubicacionesValidas" placeholder="Ej. Texas, TX, Nuevo León, Ontario, San José...">
        <datalist id="ubicacionesValidas"></datalist>
        <button onclick="iniciarBusqueda()">Buscar Empresas Reales</button>
    </div>

    <div class="resultados-info">
        <div class="loader" id="loader">Validando cobertura y consultando registros... ⏳</div>
        <div class="status" id="statusText"></div>
        
        <div id="contenedorBotones" class="botones-accion">
            <button id="btnCopiarTabla" class="btn-copiar-tabla" onclick="copiarTablaParaExcel()">Copiar Tabla para Excel 📊</button>

        </div>
    </div>

                    <th>Operación / Activity</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">

        </table>
    </div>
</div>
